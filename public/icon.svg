<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Shield Shape -->
  <path d="M256 70 C340 70, 400 90, 410 160 C410 290, 340 380, 256 440 C172 380, 102 290, 102 160 C112 90, 172 70, 256 70 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        filter="url(#glow)" />

  <!-- Inner Vault Lock Ring -->
  <circle cx="256" cy="245" r="95" fill="#020617" stroke="#334155" stroke-width="6" />
  <circle cx="256" cy="245" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Bitcoin Symbol -->
  <text x="256" y="278" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="105" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">₿</text>
</svg>
