<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <radialGradient id="vaultBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Luxury Gold & Amber Metallic Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="shieldRim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="shieldPlate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Metallic Bevel -->
  <rect width="512" height="512" rx="118" fill="url(#vaultBg)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#goldSheen)" stroke-width="3" stroke-opacity="0.4" />
  <rect width="492" height="492" x="10" y="10" rx="108" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- High-Tech Circuit & Hex Background Etchings -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <path d="M70 120 L130 120 L160 150 L200 150" />
    <path d="M442 120 L382 120 L352 150 L312 150" />
    <path d="M70 392 L130 392 L160 362 L210 362" />
    <path d="M442 392 L382 392 L352 362 L302 362" />
    <circle cx="200" cy="150" r="3" fill="#f59e0b" />
    <circle cx="312" cy="150" r="3" fill="#f59e0b" />
    <circle cx="210" cy="362" r="3" fill="#f59e0b" />
    <circle cx="302" cy="362" r="3" fill="#f59e0b" />
  </g>

  <!-- Outer Cryptographic Security Shield -->
  <path d="M256 68 
           C350 68, 412 88, 420 160 
           C420 286, 348 382, 256 444 
           C164 382, 92 286, 92 160 
           C100 88, 162 68, 256 68 Z"
        fill="url(#shieldPlate)"
        stroke="url(#shieldRim)"
        stroke-width="10"
        filter="url(#goldGlow)" />

  <!-- Inner Inset Shield Rim -->
  <path d="M256 86 
           C338 86, 396 104, 402 168 
           C402 276, 338 362, 256 422 
           C174 362, 110 276, 110 168 
           C116 104, 174 86, 256 86 Z"
        fill="none"
        stroke="#334155"
        stroke-width="2.5"
        stroke-dasharray="6 4"
        opacity="0.8" />

  <!-- Vault Lock Dial: Concentric Precision Rings -->
  <circle cx="256" cy="245" r="96" fill="#030712" stroke="#1e293b" stroke-width="4" />
  <circle cx="256" cy="245" r="90" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" stroke-opacity="0.8" />
  <circle cx="256" cy="245" r="82" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6" opacity="0.7" />

  <!-- 12 Vault Combination Pins Around the Perimeter -->
  <g fill="url(#goldSheen)">
    <circle cx="256" cy="157" r="3.5" />
    <circle cx="300" cy="169" r="3" />
    <circle cx="332" cy="201" r="3" />
    <circle cx="344" cy="245" r="3.5" />
    <circle cx="332" cy="289" r="3" />
    <circle cx="300" cy="321" r="3" />
    <circle cx="256" cy="333" r="3.5" />
    <circle cx="212" cy="321" r="3" />
    <circle cx="180" cy="289" r="3" />
    <circle cx="168" cy="245" r="3.5" />
    <circle cx="180" cy="201" r="3" />
    <circle cx="212" cy="169" r="3" />
  </g>

  <!-- Inner Beveled Dial Core -->
  <circle cx="256" cy="245" r="70" fill="url(#shieldPlate)" stroke="url(#goldSheen)" stroke-width="3" filter="url(#subtleGlow)" />

  <!-- Bitcoin Sovereign Emblem (Bold, Hand-Sculpted Vector) -->
  <g filter="url(#goldGlow)">
    <!-- Main Bitcoin glyph -->
    <path d="M236 195 
             L268 195 C282 195, 292 201, 292 215 C292 225, 285 232, 274 235 C288 238, 296 247, 296 261 C296 278, 282 287, 264 287 
             L236 287 Z 
             M252 210 L252 232 L266 232 C273 232, 277 228, 277 221 C277 214, 273 210, 266 210 Z 
             M252 248 L252 272 L267 272 C275 272, 280 267, 280 260 C280 252, 275 248, 267 248 Z" 
          fill="url(#goldSheen)" />

    <!-- Top and Bottom Bitcoin vertical bars -->
    <rect x="247" y="181" width="5.5" height="16" rx="2" fill="url(#goldSheen)" />
    <rect x="263" y="181" width="5.5" height="16" rx="2" fill="url(#goldSheen)" />
    <rect x="247" y="285" width="5.5" height="16" rx="2" fill="url(#goldSheen)" />
    <rect x="263" y="285" width="5.5" height="16" rx="2" fill="url(#goldSheen)" />
  </g>

  <!-- Bottom Cyber Security Star / Guarantee Badge -->
  <polygon points="256,412 260,422 271,422 262,428 265,438 256,432 247,438 250,428 241,422 252,422" 
           fill="url(#goldSheen)" 
           opacity="0.9" />
</svg>
